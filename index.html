<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#dceeff">
<meta name="description" content="Juan & Dara Gallery — a little collection of moments.">
<title>Juan &amp; Dara Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#12304a;--muted:#66819a;--blue:#75b9ff;--white:rgba(255,255,255,.66);--line:rgba(255,255,255,.8);--shadow:0 22px 60px rgba(56,117,166,.18)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;background:linear-gradient(135deg,#edf8ff 0%,#dcefff 45%,#f8fcff 100%);min-height:100vh;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;border-radius:999px;filter:blur(3px);z-index:-1;pointer-events:none}body:before{width:420px;height:420px;background:rgba(112,190,255,.25);top:-130px;right:-80px}body:after{width:360px;height:360px;background:rgba(184,222,255,.38);bottom:-150px;left:-100px}
.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.nav{position:sticky;top:16px;z-index:20;margin:16px auto 0;padding:12px 16px;border:1px solid var(--line);background:rgba(255,255,255,.48);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border-radius:24px;box-shadow:0 12px 35px rgba(57,112,153,.12);display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:700;letter-spacing:-.03em}.brand span{color:#4d9ee5}.counter{font-size:13px;color:var(--muted);padding:8px 12px;border:1px solid rgba(255,255,255,.8);border-radius:99px;background:rgba(255,255,255,.35)}
.hero{padding:82px 0 55px;text-align:center}.eyebrow{display:inline-flex;padding:8px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.45);color:#4e8dbb;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 8px 25px rgba(64,130,175,.1)}
h1{font-family:"Playfair Display",serif;font-size:clamp(46px,8vw,88px);line-height:.95;letter-spacing:-.055em;margin:22px 0 20px;font-weight:600}h1 em{font-style:normal;color:#4d9ee5}.hero p{max-width:560px;margin:auto;color:var(--muted);font-size:16px;line-height:1.7}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:70px}.card{position:relative;border:1px solid var(--line);border-radius:28px;padding:9px;background:rgba(255,255,255,.43);box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow:hidden;cursor:pointer;transition:transform .3s ease,box-shadow .3s ease}.card:hover{transform:translateY(-6px);box-shadow:0 28px 70px rgba(48,113,163,.25)}
.photo{position:relative;overflow:hidden;border-radius:21px;aspect-ratio:4/5;background:#d8eefe}.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .55s cubic-bezier(.2,.7,.2,1)}.card:hover img{transform:scale(1.045)}.info{padding:15px 9px 11px 10px}.num{font-size:11px;color:#75a9ce;font-weight:700;letter-spacing:.1em}.title{font-family:"Playfair Display",serif;font-size:22px;margin:3px 0 4px}.desc{font-size:12px;color:var(--muted);line-height:1.5;margin:0}.shine{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.22),transparent 35%,transparent 65%,rgba(255,255,255,.14));pointer-events:none}
.footer{text-align:center;color:#7290a7;font-size:12px;padding:0 0 35px}.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(8,35,57,.56);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.modal.open{display:flex}.modal-box{width:min(1050px,100%);max-height:94vh;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:18px;padding:12px;border:1px solid rgba(255,255,255,.65);border-radius:30px;background:rgba(238,249,255,.72);box-shadow:0 30px 100px rgba(0,20,40,.35)}
.modal-image{min-height:400px;border-radius:22px;overflow:hidden;background:#d8eefe;display:flex;align-items:center;justify-content:center}.modal-image img{width:100%;height:100%;max-height:78vh;object-fit:contain}.modal-info{padding:30px 24px;display:flex;flex-direction:column;justify-content:center}.modal-info .num{font-size:12px}.modal-info h2{font-family:"Playfair Display",serif;font-size:40px;line-height:1.05;margin:10px 0 14px}.modal-info p{color:var(--muted);line-height:1.7}.close{position:absolute;top:22px;right:22px;width:42px;height:42px;border:1px solid rgba(255,255,255,.75);border-radius:50%;background:rgba(255,255,255,.65);color:var(--ink);font-size:22px;cursor:pointer;box-shadow:0 8px 25px rgba(0,0,0,.15)}.navbuttons{display:flex;gap:9px;margin-top:25px}.navbuttons button{flex:1;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.5);color:var(--ink);padding:11px;border-radius:14px;cursor:pointer;font:inherit}.navbuttons button:hover{background:white}
@media(max-width:800px){.gallery{grid-template-columns:repeat(2,1fr);gap:14px}.card{border-radius:21px;padding:7px}.photo{border-radius:16px}.title{font-size:18px}.desc{font-size:11px}.modal-box{grid-template-columns:1fr;max-height:90vh;overflow:auto}.modal-image{min-height:300px}.modal-info{padding:10px 18px 20px}.modal-info h2{font-size:32px}}
@media(max-width:520px){.wrap{width:min(100% - 20px,1180px)}.nav{top:10px;margin-top:10px;border-radius:18px}.hero{padding:62px 0 38px}.gallery{grid-template-columns:1fr 1fr;gap:10px}.info{padding:11px 5px 8px}.title{font-size:16px}.desc{display:none}}
</style>
</head>
<body>
<div class="wrap">
<nav class="nav"><div class="brand">Juan <span>&amp;</span> Dara</div><div class="counter">15 moments</div></nav>
<header class="hero"><div class="eyebrow">our little archive</div><h1>Juan <em>&amp;</em> Dara<br>Gallery</h1><p>A small collection of faces, nights, smiles, and ordinary moments that became worth remembering.</p></header>
<main class="gallery" id="gallery"></main>
<footer class="footer">Juan &amp; Dara</footer>
</div>
<div class="modal" id="modal" aria-hidden="true"><button class="close" id="close" aria-label="Close">×</button><div class="modal-box"><div class="modal-image"><img id="modalImg" alt=""></div><div class="modal-info"><div class="num" id="modalNum"></div><h2 id="modalTitle"></h2><p id="modalDesc"></p><div class="navbuttons"><button id="prev">← Previous</button><button id="next">Next →</button></div></div></div></div>
<script>
const photos=[{"src": "photos/01.jpg", "title": "Under One Roof", "desc": "A quiet little moment, captured just as it happened.", "index": 1}, {"src": "photos/02.jpg", "title": "A Little Look", "desc": "A close-up with a playful, unplanned feeling.", "index": 2}, {"src": "photos/03.jpg", "title": "Close Enough", "desc": "Two faces, one frame, and a moment worth keeping.", "index": 3}, {"src": "photos/04.jpg", "title": "Just Juan", "desc": "A simple portrait, caught in an ordinary moment.", "index": 4}, {"src": "photos/05.jpg", "title": "Two in the Frame", "desc": "A playful snapshot from a shared day.", "index": 5}, {"src": "photos/06.jpg", "title": "Midnight Smile", "desc": "A soft smile hiding in the night.", "index": 6}, {"src": "photos/07.jpg", "title": "Soft Light", "desc": "A warm portrait with a little glow.", "index": 7}, {"src": "photos/08.jpg", "title": "Wrapped in Blue", "desc": "A calm moment wrapped in cool blue tones.", "index": 8}, {"src": "photos/09.jpg", "title": "Dreamy Little Moment", "desc": "A dreamy portrait with a touch of nostalgia.", "index": 9}, {"src": "photos/10.jpg", "title": "An Evening Pose", "desc": "An evening pose with a vintage feel.", "index": 10}, {"src": "photos/11.jpg", "title": "Sunlit", "desc": "Sunlight, leaves, and a quiet afternoon.", "index": 11}, {"src": "photos/12.jpg", "title": "A Gentle Look", "desc": "A small, gentle moment in between everything else.", "index": 12}, {"src": "photos/13.jpg", "title": "Low Light", "desc": "A moody portrait made for the low light.", "index": 13}, {"src": "photos/14.jpg", "title": "After Dark", "desc": "A late-night frame with its own atmosphere.", "index": 14}, {"src": "photos/15.png", "title": "Neon Night", "desc": "A flash of colour to end the gallery.", "index": 15}];
const gallery=document.getElementById('gallery'),modal=document.getElementById('modal'),modalImg=document.getElementById('modalImg'),modalTitle=document.getElementById('modalTitle'),modalDesc=document.getElementById('modalDesc'),modalNum=document.getElementById('modalNum');let current=0;
photos.forEach((p,i)=>{const card=document.createElement('article');card.className='card';card.tabIndex=0;card.innerHTML=`<div class="photo"><img src="${p.src}" alt="${p.title}" loading="lazy"><div class="shine"></div></div><div class="info"><div class="num">${String(p.index).padStart(2,'0')}</div><div class="title">${p.title}</div><p class="desc">${p.desc}</p></div>`;card.onclick=()=>openModal(i);card.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')openModal(i)};gallery.appendChild(card)});
function openModal(i){current=i;const p=photos[i];modalImg.src=p.src;modalImg.alt=p.title;modalTitle.textContent=p.title;modalDesc.textContent=p.desc;modalNum.textContent=`${String(p.index).padStart(2,'0')} / ${String(photos.length).padStart(2,'0')}`;modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeModal(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.style.overflow=''}
function move(n){current=(current+n+photos.length)%photos.length;openModal(current)}
document.getElementById('close').onclick=closeModal;document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(!modal.classList.contains('open'))return;if(e.key==='Escape')closeModal();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
</script>
</body>
</html>
